<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<title>Style Forge · Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0b0e;--card:#15151b;--card2:#1c1c24;--line:#2a2a34;--fg:#f2f0ea;--mut:#8d8c96;--acc:#ffb547;--acc-fg:#1a1100;--acc2:#ff5d73;--ok:#4ade80;--err:#ff6b6b;--r:14px;--rs:10px;--mono:ui-monospace,Menlo,Consolas,monospace;--hh:56px}
html,body{background:var(--bg);color:var(--fg);overflow-x:hidden}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:64px;line-height:1.45}
.mono{font-family:var(--mono);font-size:12px}
.hide{display:none!important}
header{position:sticky;top:0;z-index:40;height:var(--hh);padding:0 14px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(11,11,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header h1{font-size:18px;letter-spacing:-.02em;font-weight:800}
header h1 b{color:var(--acc)}
.chip-s{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--card2);font-size:12px;font-weight:700;color:var(--mut)}
.chip-s i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.chip-s.ok{color:var(--ok)}.chip-s.ok i{background:var(--ok)}
.chip-s.bad{color:var(--err)}.chip-s.bad i{background:var(--err)}
main{max-width:1200px;margin:0 auto;padding:12px 12px 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.panel>summary,.ph-head{padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;list-style:none;user-select:none}
.panel>summary::-webkit-details-marker{display:none}
.panel .num{width:24px;height:24px;border-radius:50%;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);flex-shrink:0}
.panel.done .num{background:var(--ok);color:#06210f}
.panel .sub{margin-left:auto;font-size:12px;color:var(--mut);font-weight:500;text-align:right}
.pbody{padding:0 16px 16px}
.lbl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 7px}
.lbl:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--rs);background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.btn.big{width:100%;min-height:56px;font-size:16px;border-radius:14px}
.btn.sm{min-height:34px;padding:6px 12px;font-size:12px}
.btn.dng{color:var(--err)}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--fg)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kc{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:8px;background:var(--card2);font:11px var(--mono);border:1px solid var(--line)}
.kc em{font-style:normal;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:#333}
.kc.ok em{background:rgba(74,222,128,.18);color:var(--ok)}.kc.bad em{background:rgba(255,107,107,.18);color:var(--err)}.kc.cool em{background:rgba(255,181,71,.2);color:var(--acc)}
.kc button{opacity:.55;padding:0 4px;font-size:14px}
.warn{background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.4);color:var(--acc);padding:10px 12px;border-radius:var(--rs);font-size:12.5px;margin-bottom:10px}
.drops{display:grid;grid-template-columns:1fr;gap:10px}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:var(--r);min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);cursor:pointer;overflow:hidden;background:var(--card2)}
.drop.has{border-style:solid;min-height:0;height:170px}
.drop img{width:100%;height:100%;object-fit:cover}
.drop .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff}
.drop .tag{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.65);padding:3px 8px;border-radius:99px}
.strip{position:sticky;top:var(--hh);z-index:30;margin:0 -12px 10px;padding:8px 12px;display:flex;gap:6px;overflow-x:auto;background:rgba(11,11,14,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex-shrink:0;padding:7px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap}
.strip button.on{background:var(--fg);color:#111;border-color:var(--fg)}
.strip button small{opacity:.6;font-weight:600;margin-left:4px}
.strip .sep{width:1px;background:var(--line);flex-shrink:0;margin:0 2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;align-items:start}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1150px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.card{position:relative;aspect-ratio:var(--ar,3/4);border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 220px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.card img.on{opacity:1}
.card .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;text-align:center;font-size:11.5px;color:var(--mut);background:linear-gradient(135deg,#17171e,#1e1e28)}
.card.done .ph{display:none}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--acc);animation:sp 0.9s linear infinite}
.card.error .spin,.card.cancel .spin,.card.concept .spin{animation:none;border-color:var(--line)}
.card.queued .spin{animation-duration:2.4s}
@keyframes sp{to{transform:rotate(360deg)}}
.card .cl{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 7px;font-size:11px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:not(.done) .cl{display:none}
.card .cb{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:4px;pointer-events:none}
.card .cb span{font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.62)}
.card .cb .fv{margin-left:auto;color:var(--acc2)}
.card .cb span:empty{display:none}
.card.error .ph{color:var(--err)}
.empty{text-align:center;padding:44px 20px;color:var(--mut)}
.empty b{display:block;font-size:17px;color:var(--fg);margin-bottom:6px}
#runbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:45;padding:8px 12px}
#runbar .in{max-width:640px;margin:0 auto;background:#1d1d27;border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:rgba(11,11,14,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:10px 0 9px;font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button span{font-size:19px}
#tabs button.on{color:var(--acc)}
#viewer{position:fixed;inset:0;z-index:70;background:#050507;display:flex;flex-direction:column;touch-action:pan-y}
.v-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.v-top .t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-top .t small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.v-img{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.v-img img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;font-size:26px;color:#fff;background:rgba(0,0,0,.35);border-radius:12px}
.v-kids{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.v-kids::-webkit-scrollbar{display:none}
.v-kids .k{position:relative;flex-shrink:0;height:62px;border-radius:8px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.v-kids .k img{height:100%;width:auto;display:block}
.v-kids .k.cur{border-color:var(--acc)}
.v-bar{display:flex;gap:8px;padding:8px 12px calc(12px + env(safe-area-inset-bottom));justify-content:space-between}
.v-bar .btn{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:8px 4px;min-height:54px}
.v-bar .btn span{font-size:19px}
#sheet{position:fixed;inset:0;z-index:90}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sh-box{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-width:760px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;border:1px solid var(--line);display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;font-weight:800;font-size:16px}
.sh-body{overflow-y:auto;padding:0 16px 16px;flex:1;-webkit-overflow-scrolling:touch}
.sh-foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.ideas{display:flex;flex-direction:column;gap:6px}
.idea{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:var(--rs);background:var(--card2);border:1px solid var(--line);cursor:pointer;text-align:left}
.idea.on{border-color:var(--acc);background:rgba(255,181,71,.08)}
.idea .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mut);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--acc-fg)}
.idea.on .ck{background:var(--acc);border-color:var(--acc)}
.idea b{display:block;font-size:13px}.idea small{color:var(--mut);font-size:11.5px}
.shotg{display:flex;flex-wrap:wrap;gap:6px}
.shotg button{padding:8px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.shotg button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.film{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;cursor:pointer}
.film h3{font-size:16px}.film p{color:var(--mut);font-size:13px;margin-top:3px}
.scenes{display:flex;flex-direction:column;gap:10px}
.scene{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.scene .th{position:relative;width:46%;max-width:300px;flex-shrink:0;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--card2);cursor:pointer}
.scene .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene .th .sp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut)}
.scene .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.scene .tx input{font-weight:700;padding:7px 9px}
.scene .tx textarea{font-size:12.5px;min-height:70px;padding:7px 9px}
.scene .th{align-self:flex-start}
@media(max-width:560px){.scene{flex-direction:column}.scene .th{width:100%;max-width:none}.scene .tx{width:100%}}
.tabs2{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs2 button{padding:8px 14px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.tabs2 button.on{background:var(--fg);color:#111}
.terr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.terr input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex-shrink:0}
.terr .n{flex:1;min-width:0}.terr small{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toasts{position:fixed;left:0;right:0;top:calc(66px + env(safe-area-inset-top));z-index:120;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#23232d;border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:92vw;animation:up .2s}
.toast.err{border-color:var(--err);color:var(--err)}.toast.ok{border-color:var(--ok);color:var(--ok)}
.pre{font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--card2);padding:10px;border-radius:var(--rs);max-height:260px;overflow:auto;color:#cfcdd6}
.more{display:block;margin:14px auto}
</style>
</head>
<body>
<header>
  <h1>Style<b>Forge</b></h1>
  <div class="row"><span class="chip-s" id="storeChip" title="Stockage"><i></i><span>…</span></span><button class="chip-s" id="keyChip" data-act="goKeys"><i></i><span>0 clé</span></button></div>
</header>
<main>
  <section id="v-studio">
    <div id="warnBox"></div>
    <details class="panel" id="pKeys" open>
      <summary><span class="num">1</span> Clés API <span class="sub" id="keysSub">à ajouter</span></summary>
      <div class="pbody">
        <textarea id="keysIn" rows="3" spellcheck="false" autocomplete="off" placeholder="Colle tes clés ici : une par ligne, ou séparées par des espaces / virgules. Tout format est accepté."></textarea>
        <div class="row" style="margin-top:8px"><button class="btn pri grow" data-act="addKeys">Ajouter &amp; tester</button><button class="btn" data-act="retestKeys">↻ Retester</button></div>
        <div class="keys" id="keysList"></div>
        <p class="hint" id="keysHint"></p>
      </div>
    </details>
    <details class="panel" id="pPhoto" open>
      <summary><span class="num">2</span> Photo de référence <span class="sub" id="photoSub">visage à conserver</span></summary>
      <div class="pbody">
        <div class="drops" id="drops"></div>
        <p class="hint" id="photoHint">Le visage de cette personne restera identique sur toutes les images. Tout le reste change.</p>
      </div>
    </details>
    <details class="panel" id="pCreate" open>
      <summary><span class="num">3</span> Création <span class="sub" id="createSub"></span></summary>
      <div class="pbody" id="createBody"></div>
    </details>
    <div id="gallery"></div>
  </section>
  <section id="v-films" class="hide"></section>
  <section id="v-admin" class="hide"></section>
</main>
<div id="runbar" class="hide"></div>
<nav id="tabs">
  <button data-act="tab" data-v="studio" class="on"><span>🎞️</span>Studio</button>
  <button data-act="tab" data-v="films"><span>🎬</span>Films</button>
  <button data-act="tab" data-v="admin"><span>⚙️</span>Admin</button>
</nav>
<div id="viewer" class="hide"></div>
<div id="sheet" class="hide"></div>
<div id="toasts"></div>
<input type="file" id="fileIn" accept="image/*" class="hide">
<input type="file" id="importIn" accept="application/json" class="hide">
<script>
'use strict';
/* ═════════════ OUTILS ═════════════ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
function toast(msg,type=''){const d=document.createElement('div');d.className='toast '+type;d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),type==='err'?4500:2400)}
function parseJson(t){if(!t)return null;let c=String(t).trim();const f=c.match(/```(?:json)?\s*([\s\S]*?)```/);if(f)c=f[1].trim();
  const a=c.search(/[\[{]/);if(a<0)return null;c=c.slice(a);const e=Math.max(c.lastIndexOf(']'),c.lastIndexOf('}'));if(e>0)c=c.slice(0,e+1);
  try{return JSON.parse(c)}catch(_){}
  try{return JSON.parse(c.replace(/,\s*([\]}])/g,'$1').replace(/[\u0000-\u001f]+/g,' '))}catch(_){}
  // réparation d'un tableau tronqué : on garde les objets complets
  if(c[0]==='['){const out=[];let d=0,s=-1,q=false,x=false;for(let i=0;i<c.length;i++){const ch=c[i];if(x){x=false;continue}if(ch==='\\'){x=true;continue}if(ch==='"'){q=!q;continue}if(q)continue;if(ch==='{'){if(d===0)s=i;d++}else if(ch==='}'){d--;if(d===0&&s>=0){try{out.push(JSON.parse(c.slice(s,i+1)))}catch(_){}s=-1}}}return out.length?out:null}
  return null}

/* ═════════════ STOCKAGE ROBUSTE (localStorage + IndexedDB + mémoire) ═════════════ */
const IDB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('styleforge8',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('thumbs')};
    r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
  _r(q){return new Promise((ok,ko)=>{q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)})},
  st(n,m){return this.db.transaction(n,m||'readonly').objectStore(n)},
  async get(s,k){if(!this.db)return;try{return await this._r(this.st(s).get(k))}catch(e){}},
  async put(s,v,k){if(!this.db)return false;try{await this._r(k===undefined?this.st(s,'readwrite').put(v):this.st(s,'readwrite').put(v,k));return true}catch(e){return false}},
  async del(s,k){if(!this.db)return;try{await this._r(this.st(s,'readwrite').delete(k))}catch(e){}},
  async all(s){if(!this.db)return[];try{return await this._r(this.st(s).getAll())}catch(e){return[]}},
  async keys(s){if(!this.db)return[];try{return await this._r(this.st(s).getAllKeys())}catch(e){return[]}},
  async clear(s){if(!this.db)return;try{await this._r(this.st(s,'readwrite').clear())}catch(e){}}};
const BIG=new Set(['ref','ref2']);
const KV={cache:{},ls:false,
  async init(){await IDB.open();

const Pool={list:[],
  load(){this.list=KV.get('keys',[]).map(k=>this.list.find(x=>x.key===k)||{key:k,st:'new',cool:0,last:{img:0,txt:0},n:0,err:0})},
  save(){KV.set('keys',this.list.map(k=>k.key))},
  parse(txt){return[...new Set(String(txt).split(/[\s,;]+/).map(s=>s.replace(/^["'`<(\[]+|["'`>)\],]+$/g,'').replace(/^bearer/i,'').trim()).filter(s=>s.length>=8))]},
  add(keys){let n=0;for(const k of keys)if(!this.list.some(x=>x.key===k)){this.list.push({key:k,st:'new',cool:0,last:{img:0,txt:0},n:0,err:0});n++}this.save();return n},
  usable(){return this.list.filter(k=>k.st!=='bad')},
  ready(){const n=Date.now();return this.usable().filter(k=>k.cool<=n)},
  changed:debounce(()=>{renderKeys();updateHeader();renderCreate()},250),
  async acquire(kind,interval,sig){const t0=Date.now();
    for(;;){if(sig.aborted)throw new Error('Arrêté');const now=Date.now();
      const c=this.usable().filter(k=>k.cool<=now&&k.last[kind]+interval<=now);
      if(c.length){c.sort((a,b)=>a.last[kind]-b.last[kind]||a.n-b.n);const k=c[0];k.last[kind]=now;k.n++;return k}
      if(!this.usable().length)throw new Error('Aucune clé valide');
      if(now-t0>150000)throw new Error("Clés saturées (délai dépassé)");
      await sleep(150)}}};

/* ═════════════ APPELS API ═════════════ */
const Q={jobs:[],run:0,ctrl:new AbortController(),paused:false,times:[]};
async function api(path,body,{kind='img',interval=3000,tries=5}={}){
  const sig=Q.ctrl.signal;let last;
  for(let a=0;a<tries;a++){
    const k=await Pool.acquire(kind,interval,sig);let r;
    try{r=await fetch(API+path,{method:'POST',signal:sig,headers:{'Content-Type':'application/json',Authorization:'Bearer '+k.key},body:JSON.stringify(body)})}
    catch(e){if(sig.aborted)throw new Error('Arrêté');last=e;await sleep(800+a*700);continue}
    if(r.ok){k.err=0;if(k.st==='new'){k.st='ok';Pool.changed()}try{return await r.json()}catch(e){last=e;continue}}
    const txt=(await r.text().catch(()=>'')).slice(0,240);const err=new Error('HTTP '+r.status+' '+txt);err.status=r.status;last=err;
    if(r.status===401||r.status===403){if(++k.err>=2){k.st='bad';Pool.changed()}continue}
    if(r.status===429){const ra=+r.headers.get('retry-after');k.cool=Date.now()+(ra?ra*1000:45000);Pool.changed();continue}
    if(r.status>=500||r.status===408){await sleep(1500+a*1200);continue}
    throw err}
  throw last||new Error('Échec API')}
const imgInterval=size=>size==='2K'?12500:3100;
async function genImage(prompt,{size='1K',ratio='3:4',refs=[],faceNeeded=true}={}){
  const body={model:M_IMG,prompt:String(prompt).slice(0,1900),n:1,size,ratio,extra_body:{response_format:'url'}};
  if(refs.length)body.image=refs;
  let d;
  try{d=await api('/images/generations',body,{kind:'img',interval:imgInterval(size)})}
  catch(e){
    if(e.status===400&&refs.length>1){body.image=refs.slice(0,1);try{d=await api('/images/generations',body,{kind:'img',interval:imgInterval(size)})}catch(e2){if(e2.status===400&&!faceNeeded){delete body.image;d=await api('/images/generations',body,{kind:'img',interval:imgInterval(size)})}else throw e2}}
    else if(e.status===400&&refs.length&&!faceNeeded){delete body.image;d=await api('/images/generations',body,{kind:'img',interval:imgInterval(size)})}
    else throw e}
  const it=d&&d.data&&d.data[0];if(!it)throw new Error("Pas d'image reçue");
  if(it.url)return it.url;if(it.b64_json)return 'data:image/png;base64,'+it.b64_json;throw new Error('Format inconnu')}
async function callText(messages,{max=1500,temp=0.9}={}){
  const d=await api('/chat/completions',{model:M_TEXT,messages,temperature:temp,max_tokens:max,reasoning_effort:'none',chat_template_kwargs:{enable_thinking:false}},{kind:'txt',interval:4500,tries:3});
  const m=d.choices&&d.choices[0]&&d.choices[0].message;return(m&&(m.content||m.reasoning_content))||''}

  let fresh=pool.filter(t=>!S.used[t.id]);
  if(fresh.length<n){pool.forEach(t=>delete S.used[t.id]);fresh=pool.slice()}
  const by={};shuffle(fresh).forEach(t=>(by[t.cat]=by[t.cat]||[]).push(t));
  const cats=shuffle(Object.keys(by)),out=[];
  while(out.length<n&&cats.some(c=>by[c].length)){for(const c of cats){if(out.length>=n)break;const t=by[c].pop();if(t)out.push(t)}}
  while(out.length<n)out.push(pick(pool));
  out.forEach(t=>{S.used[t.id]=1});saveUsed();
  let res=out;
  if(S.cfg.variety==='shock'){
    res=out.map(a=>{if(Math.random()>0.45)return a;const b=pick(pool.filter(x=>x.cat!==a.cat))||pick(pool);
      return{id:a.id+'+'+b.id,cat:a.cat,name:a.name+' × '+b.name,prompt:('Fusion of two worlds — '+a.prompt.slice(0,190)+' COMBINED WITH '+b.prompt.slice(0,190))}})}
  return shuffle(res)}

async function doThumb(it){
  try{const r=await fetch(it.url,{mode:'cors'});if(!r.ok)throw 0;const blob=await r.blob();const bmp=await createImageBitmap(blob);
    const sc=Math.min(1,380/bmp.width),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);if(bmp.close)bmp.close();
    const tb=await new Promise(res=>c.toBlob(res,'image/jpeg',0.74));if(!tb)throw 0;
    if(!(await IDB.put('thumbs',tb,it.id)))MEMB.set(it.id,tb);it.thumb=true;save(it)}
  catch(e){it.thumb=false}
  syncAll(it.id)}

async function makeFilm(src,idea){

  let j=null;
  for(const withImg of [true,false]){
    try{const content=withImg&&src.url?[{type:'text',text},{type:'image_url',image_url:{url:src.url}}]:text;

/* ═════════════ IMAGES PARESSEUSES (libère la RAM hors écran) ═════════════ */
const IO=new IntersectionObserver(es=>{for(const e of es){e.target._vis=e.isIntersecting;syncImg(e.target)}},{rootMargin:'1400px 500px'});
async function syncImg(el){
  const img=el.firstElementChild,it=byId(el.dataset.id);if(!img||!it)return;
  if(el._vis&&it.status==='done'){if(img._set)return;img._set=1;
    let src=null;if(it.thumb)src=await thumbURL(it.id);src=src||it.url;
    if(!el._vis||!img._set){return}
    img.onload=()=>img.classList.add('on');img.src=src}
  else if(!el._vis&&img._set){img.removeAttribute('src');img.classList.remove('on');img._set=0;releaseThumb(it.id)}}
function syncAll(id){$$('.lz[data-id="'+id+'"]').forEach(el=>{const i=el.firstElementChild;if(i&&i._set){i._set=0}syncImg(el)})}
function observe(root){$$('.lz',root).forEach(el=>{el._vis=false;IO.observe(el)})}
function resetLazy(){IO.disconnect();TU.forEach(u=>URL.revokeObjectURL(u));TU.clear()}

/* ═════════════ MISE À JOUR GLOBALE D'UN ITEM ═════════════ */
function upd(it){
  $$('[data-id="'+it.id+'"]').forEach(el=>{
    if(el.classList.contains('card')||el.classList.contains('k')||el.classList.contains('th')){
      ['concept','idle','queued','running','done','error','cancel'].forEach(c=>el.classList.remove(c));el.classList.add(it.status);
      const pt=$('.pt',el);if(pt)pt.textContent=STATUS_TXT[it.status]||'';
      const cl=$('.cl',el);if(cl)cl.textContent=it.title;
      const pn=$('.ptt',el);if(pn)pn.textContent=it.title;
      const fv=$('.fv',el);if(fv)fv.textContent=it.fav?'❤':'';
      const kc=$('.kcn',el);if(kc){const n=kidsOf(it.id).length;kc.textContent=n?'🎬'+n:''}
      syncImg(el)}});
  if(V.open&&it.id===V.cur)renderViewer();
  if(V.open)refreshViewerKids();
  const root=it.parentId&&byId(it.parentId);if(root)upd2(root);
  throttleBar();updateStripCounts()}
function upd2(root){$$('.card[data-id="'+root.id+'"] .kcn').forEach(kc=>{const n=kidsOf(root.id).length;kc.textContent=n?'🎬'+n:''})}
const throttleBar=debounce(()=>{runbar()},120);
const updateStripCounts=debounce(()=>renderStrip(),400);

function renderPhoto(){

function readImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const sc=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.88))};im.src=fr.result};fr.readAsDataURL(file)})}
async function setPhoto(file,k){
  if(!file||!file.type.startsWith('image/')){toast('Fichier image requis','err');return}
  try{const d=await readImage(file);S[k]=d;KV.set(k,d);if(k==='ref'){S.analysis='';KV.set('analysis','')}renderPhoto();renderCreate();toast('Photo enregistrée','ok')}catch(e){toast('Image illisible','err')}}

  if(S.filter==='plans')return S.items.filter(i=>i.kind==='shot'||i.kind==='edit'||i.kind==='variant').sort((a,b)=>b.t-a.t);

/* ═════════════ BARRE DE PROGRESSION ═════════════ */
function runbar(){
  const el=$('#runbar'),pend=pending(),s=Q.s,errs=S.items.filter(i=>i.status==='error'&&(S.filter!=='batch'||i.batchId===S.active)).length;
  if(!pend&&!errs){el.classList.add('hide');if(!pend){Q.s={tot:0,ok:0,ko:0}}return}
  el.classList.remove('hide');
  if(!pend){el.innerHTML=`<div class="in"><div class="row"><span class="grow">⚠️ ${errs} image${errs>1?'s':''} en échec</span><button class="btn sm pri" data-act="retryErr">↻ Tout relancer</button></div></div>`;return}
  const done=s.ok+s.ko,tot=Math.max(s.tot,done+pend),t=Q.times;let eta='';
  if(t.length>=4){const span=(t[t.length-1]-t[0])/1000,rate=(t.length-1)/Math.max(span,1);if(rate>0){const sec=Math.round(pend/rate);eta=' · ~'+(sec>90?Math.round(sec/60)+' min':sec+' s')}}
  el.innerHTML=`<div class="in"><div class="row"><b>${done}/${tot}</b><span class="mono grow">${Q.run} en cours${s.ko?' · ⚠ '+s.ko:''}${eta}</span><button class="btn sm" data-act="pause">${Q.paused?'▶ Reprendre':'⏸ Pause'}</button><button class="btn sm dng" data-act="stop">⏹ Stop</button></div><div class="bar"><i style="width:${Math.round(done/tot*100)}%"></i></div></div>`}

function renderFilms(){

  if(!f){el.innerHTML=`<h2 style="margin:6px 0 12px">🎬 Mes films</h2>`+(S.films.length?S.films.map(x=>{const g=x.scenes.filter(s=>(byId(s.itemId)||{}).status==='done').length;return `<div class="film" data-act="filmOpen" data-id="${x.id}"><h3>${esc(x.title)}</h3><p>${esc(x.logline)}</p><p class="mono">${x.scenes.length} scènes · ${g} générée${g>1?'s':''}</p></div>`}).join(''):`<div class="empty"><b>Aucun film pour l'instant</b>Ouvre une image dans le Studio, touche 🎬 Cinéma, puis « Développer un film ». L'IA écrit un scénario de 10 scènes avec le même acteur.</div>`);return}
  const g=f.scenes.filter(s=>(byId(s.itemId)||{}).status==='done').length;
  el.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn sm" data-act="filmBack">‹ Films</button><span class="grow"></span><button class="btn sm dng" data-act="filmDel">🗑</button></div>
  <input data-ff="title" value="${esc(f.title)}" style="font-size:18px;font-weight:800;margin-bottom:8px">
  <input data-ff="logline" value="${esc(f.logline)}" style="margin-bottom:8px">
  <textarea data-ff="synopsis" style="margin-bottom:10px">${esc(f.synopsis)}</textarea>
  <div class="row" style="margin-bottom:12px"><button class="btn pri grow" data-act="filmGenAll">▶ Générer les scènes manquantes (${f.scenes.length-g})</button><button class="btn" data-act="filmMore">➕ 4 scènes</button><button class="btn" data-act="filmTxt">⬇ Script</button></div>
  <div class="scenes">${f.scenes.map((sc,i)=>{const it=byId(sc.itemId)||{status:'idle'};return `<div class="scene"><div class="th lz ${it.status}" data-id="${sc.itemId}" data-act="scOpen" data-s="${sc.id}"><img alt=""><span class="sp pt">${it.status==='done'?'':(STATUS_TXT[it.status]||'')}</span></div><div class="tx"><input data-sc="${sc.id}" data-f="title" value="${esc(sc.title)}"><textarea data-sc="${sc.id}" data-f="desc">${esc(sc.desc)}</textarea><div class="row"><span class="mono">#${i+1}</span><button class="btn sm grow" data-act="scGen" data-s="${sc.id}">${it.status==='done'?'↻ Refaire':'▶ Générer'}</button><button class="btn sm" data-act="scUp" data-s="${sc.id}">▲</button><button class="btn sm" data-act="scDown" data-s="${sc.id}">▼</button><button class="btn sm dng" data-act="scDel" data-s="${sc.id}">✕</button></div></div></div>`}).join('')}</div>`;
  observe(el)}
const scById=(f,id)=>f.scenes.find(s=>s.id===id);

function delItem(it,keepKids){
  if(!keepKids)S.items.filter(x=>x.parentId===it.id).forEach(k=>delItem(k,true));
  S.items=S.items.filter(x=>x.id!==it.id);S.byId.delete(it.id);IDB.del('items',it.id);IDB.del('thumbs',it.id);MEMB.delete(it.id);releaseThumb(it.id);
  S.films.forEach(f=>{f.scenes=f.scenes.filter(s=>s.itemId!==it.id)});saveFilms()}

  filmDel:()=>{const f=S.films.find(x=>x.id===S.filmOpen);if(!f||!confirm('Supprimer ce film et ses images ?'))return;f.scenes.forEach(s=>{const it=byId(s.itemId);if(it)delItem(it,true)});S.films=S.films.filter(x=>x!==f);saveFilms();S.filmOpen=null;renderFilms()},
  filmGenAll:()=>{const f=S.films.find(x=>x.id===S.filmOpen);if(!f)return;if(!Pool.usable().length){toast('Aucune clé valide','err');return}let n=0;f.scenes.forEach(sc=>{const it=byId(sc.itemId);if(it&&it.status!=='done'&&it.status!=='queued'&&it.status!=='running'){genScene(f,sc);n++}});toast(n?n+' scènes en cours…':'Tout est déjà généré','ok');renderFilms()},

  filmTxt:()=>{const f=S.films.find(x=>x.id===S.filmOpen);if(!f)return;downloadText(slug(f.title)+'.txt',`${f.title}\n${f.logline}\n\n${f.synopsis}\n\n`+f.scenes.map((s,i)=>`SCÈNE ${i+1} — ${s.title}\n${s.desc}\n`).join('\n'))},
  scGen:el=>{const f=S.films.find(x=>x.id===S.filmOpen),sc=f&&scById(f,el.dataset.s);if(!sc)return;genScene(f,sc);renderFilms()},
  scOpen:el=>{const f=S.films.find(x=>x.id===S.filmOpen),sc=f&&scById(f,el.dataset.s),it=sc&&byId(sc.itemId);if(!it)return;if(it.status==='done')openViewer(it.id,f.scenes.map(s=>byId(s.itemId)).filter(Boolean));else if(it.status==='idle'||it.status==='error'||it.status==='cancel'){genScene(f,sc);renderFilms()}},
  scDel:el=>{const f=S.films.find(x=>x.id===S.filmOpen),sc=f&&scById(f,el.dataset.s);if(!sc)return;const it=byId(sc.itemId);if(it)delItem(it,true);f.scenes=f.scenes.filter(s=>s!==sc);saveFilms();renderFilms()},
  scUp:el=>moveScene(el,-1),scDown:el=>moveScene(el,1),
  admTab:el=>{admTab=el.dataset.t;renderAdmin()},
  admCat:el=>{admCat=el.dataset.c;renderAdmin()},
  resetPrompts:()=>{if(!confirm('Réinitialiser tous les prompts ?'))return;['face','free','woman','man','text','qual','sys'].forEach(k=>ADM[k]=DEF[k]);ADM.exprs=Object.assign({},DEF.exprs);saveAdmin();renderAdmin()},
  terrAll:()=>{ADM.disabled=[];saveAdmin();renderAdmin()},
  resetUsed:()=>{S.used={};saveUsed();renderAdmin();toast('Tous les styles sont de nouveau disponibles','ok')},
  addTerr:()=>{const n=$('#nsName').value.trim(),p=$('#nsPrompt').value.trim();if(!n||!p){toast('Nom et description requis','err');return}ADM.custom.push({id:'c'+uid(),cat:$('#nsCat').value,name:n,prompt:p});saveAdmin();renderAdmin();toast('Style ajouté','ok')},

function moveScene(el,d){const f=S.films.find(x=>x.id===S.filmOpen);if(!f)return;const i=f.scenes.findIndex(s=>s.id===el.dataset.s),j=i+d;if(i<0||j<0||j>=f.scenes.length)return;[f.scenes[i],f.scenes[j]]=[f.scenes[j],f.scenes[i]];saveFilms();renderFilms()}
function renderIdeas(){$('#ideasBox').innerHTML=CS.ideas.map((x,i)=>`<button class="idea" data-act="idea" data-i="${i}"><span class="ck">✓</span><span><b>${esc(x.label)}</b><small>${esc((x.t||'').slice(0,110))}</small></span></button>`).join('');updGenSel()}
async function ensureAnalysisThenCreate(){
  if(!Pool.usable().length){toast('Ajoute au moins une clé API','err');openPanel('pKeys');return}
  if(!S.ref){toast('Ajoute d\'abord une photo','err');openPanel('pPhoto');return}
  Q.paused=false;const p=ensureAnalysis();await Promise.race([p,sleep(0)]);
  const prom=createBatch();await p;await prom}
function exportData(){
  const inc=$('#expKeys')&&$('#expKeys').checked;
  const data={v:8,cfg:S.cfg,admin:ADM,films:S.films,batches:S.batches,used:S.used,analysis:S.analysis,ref:S.ref,ref2:S.ref2,items:S.items.map(i=>{const c=Object.assign({},i);Object.keys(c).forEach(k=>{if(k[0]==='_')delete c[k]});return c}),keys:inc?Pool.list.map(k=>k.key):undefined};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='style-forge-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}
async function importData(file){
  try{const d=JSON.parse(await file.text());if(!d||d.v!==8)throw new Error('Format inconnu');
    if(d.cfg){S.cfg=Object.assign({},CFG0,d.cfg);saveCfg()}if(d.admin){ADM=Object.assign(JSON.parse(JSON.stringify(DEF)),d.admin);saveAdmin()}
    if(d.keys&&d.keys.length){Pool.add(d.keys)}
    if(d.ref){S.ref=d.ref;KV.set('ref',d.ref)}if(d.ref2){S.ref2=d.ref2;KV.set('ref2',d.ref2)}if(d.analysis){S.analysis=d.analysis;KV.set('analysis',d.analysis)}
    if(d.used){S.used=d.used;saveUsed()}
    const ids=new Set(S.items.map(i=>i.id));(d.items||[]).forEach(it=>{if(ids.has(it.id))return;if(['running','queued','concept'].includes(it.status))it.status='cancel';it.thumb=false;addItem(it);makeThumbSoon(it)});
    (d.batches||[]).forEach(b=>{if(!S.batches.some(x=>x.id===b.id))S.batches.push(b)});saveBatches();
    (d.films||[]).forEach(f=>{if(!S.films.some(x=>x.id===f.id))S.films.push(f)});saveFilms();
    S.active=S.batches.length?S.batches[S.batches.length-1].id:null;boot2();toast('Import terminé','ok')}
  catch(e){toast('Import impossible : '+e.message,'err')}}
function makeThumbSoon(it){if(it.status==='done'&&it.url)makeThumb(it)}

/* ═════════════ ÉVÉNEMENTS ═════════════ */
document.addEventListener('click',e=>{
  const sg=e.target.closest('[data-seg]');
  if(sg){const k=sg.dataset.seg;let v=sg.dataset.v;if(k==='n')v=+v;S.cfg[k]=v;saveCfg();
    if(k==='shotRatio'){$$('[data-seg="shotRatio"]').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}else{renderCreate();renderKeys()}return}
  const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){ACT[a.dataset.act](a,e)}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cfg){let v=t.value;if(t.dataset.cfg==='workers'){v=Math.round(+v)||0;if(v===autoWorkers())v=0;t.value=v||autoWorkers()}S.cfg[t.dataset.cfg]=v;saveCfg();if(t.dataset.cfg==='workers'){updateCreateInfo();Q.pump()}}
  else if(t.dataset.adm){ADM[t.dataset.adm]=t.value;saveAdmin()}
  else if(t.dataset.admx){ADM.exprs[t.dataset.admx]=t.value;saveAdmin()}
  else if(t.dataset.admL){ADM[t.dataset.admL]=t.value.split(',').map(s=>s.trim()).filter(Boolean);saveAdmin()}
  else if(t.dataset.terr!==undefined){const id=t.dataset.terr;ADM.disabled=ADM.disabled.filter(x=>x!==id);if(!t.checked)ADM.disabled.push(id);saveAdmin();renderAdmin()}
  else if(t.dataset.ff){const f=S.films.find(x=>x.id===S.filmOpen);if(f){f[t.dataset.ff]=t.value;saveFilms()}}
  else if(t.dataset.sc){const f=S.films.find(x=>x.id===S.filmOpen),sc=f&&scById(f,t.dataset.sc);if(sc){sc[t.dataset.f]=t.value;saveFilms();if(t.dataset.f==='title'){const it=byId(sc.itemId);if(it){it.title=t.value;save(it)}}}}
  else if(t.id==='fileIn'){const f=t.files[0];t.value='';setPhoto(f,fileTarget)}
  else if(t.id==='importIn'){const f=t.files[0];t.value='';if(f)importData(f)}});
document.addEventListener('input',e=>{if(e.target.dataset.cfg==='text'){S.cfg.text=e.target.value;saveCfg()}});
document.addEventListener('keydown',e=>{if(V.open&&!$('#sheet').innerHTML){if(e.key==='ArrowLeft')navV(-1);else if(e.key==='ArrowRight')navV(1);else if(e.key==='Escape')closeViewer()}else if(e.key==='Escape')closeSheet()});
document.addEventListener('paste',e=>{if(e.target.id==='keysIn')setTimeout(addKeysFromInput,30)});
['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('.drop');if(!d)return;e.preventDefault();if(ev==='drop'){const k=d.dataset.k||d.dataset.drop||'ref';const f=e.dataTransfer.files[0];if(f)setPhoto(f,k)}}));
window.addEventListener('beforeunload',e=>{if(pending()>0){e.preventDefault();e.returnValue=''}});

/* ═════════════ DÉMARRAGE ═════════════ */
function boot2(){
  Pool.load();updateHeader();renderKeys();renderPhoto();renderCreate();
  $('#gallery').innerHTML='<div class="strip hide" id="strip"></div><div id="gridwrap"></div>';
  if(!S.active&&S.batches.length)S.active=S.batches[S.batches.length-1].id;
  renderGrid();runbar();if(S.view==='films')renderFilms();if(S.view==='admin')renderAdmin()}
(async function init(){
  await KV.init();loadAdmin();
  S.cfg=Object.assign({},CFG0,KV.get('cfg',{}));S.ref=KV.get('ref',null);S.ref2=KV.get('ref2',null);S.analysis=KV.get('analysis','');
  S.batches=KV.get('batches',[]);S.films=KV.get('films',[]);S.used=KV.get('used',{});
  const saved=await IDB.all('items');saved.sort((a,b)=>a.t-b.t);
  saved.forEach(it=>{if(['running','queued','concept'].includes(it.status))it.status='cancel';S.items.push(it);S.byId.set(it.id,it)});
  boot2();
  // repli automatique : si tout est prêt, on replie les étapes 1 et 2 pour laisser la place à la création
  if(Pool.usable().length&&S.ref){$('#pKeys').open=false;$('#pPhoto').open=false}
  // teste en arrière-plan les clés jamais testées
  Pool.list.filter(k=>k.st==='new').forEach(testKey);
  window.SF={S,Pool,Q,KV,ADM:()=>ADM}})();

</script>
